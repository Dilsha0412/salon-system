server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
              - "HEAD"
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth Service Route
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        # Booking Services Route
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/bookings/**, /api/services/**, /api/stylists/**, /api/customers/**, /api/appointments/**

        # AI Agent Service Route
        - id: ai-agent-service
          uri: ${AI_SERVICE_URL:http://127.0.0.1:8000}
          predicates:
            - Path=/api/chat, /api/chat/**

